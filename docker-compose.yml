services:
  postgres:
    # PostgreSQL 16 image already available in the local Docker cache.
    # It is wire-compatible with the upstream postgres:16 image and avoids
    # requiring a registry pull during local initialization.
    image: pgvector/pgvector:pg16
    container_name: hku-edu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hku_edu
      POSTGRES_USER: hku
      POSTGRES_PASSWORD: hku_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hku -d hku_edu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
